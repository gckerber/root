name: Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - 'apps/admin/**'
      - '.github/workflows/deploy-admin.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Write .env.production with real values
        run: |
          cat > apps/admin/.env.production << EOF
          VITE_API_BASE_URL=https://${{ secrets.VITE_API_BASE_URL }}
          VITE_ADMIN_USERNAME=admin
          VITE_ADMIN_PASSWORD=${{ secrets.VITE_ADMIN_PASSWORD }}
          VITE_VILLAGE_USERNAME=${{ secrets.VITE_VILLAGE_USERNAME }}
          VITE_VILLAGE_PASSWORD=${{ secrets.VITE_VILLAGE_PASSWORD }}
          VITE_POLICE_USERNAME=${{ secrets.VITE_POLICE_USERNAME }}
          VITE_POLICE_PASSWORD=${{ secrets.VITE_POLICE_PASSWORD }}
          VITE_VILLAGE_URL=https://${{ secrets.VILLAGE_HOSTNAME }}
          VITE_PD_API_URL=https://func-village-prod.azurewebsites.net
          EOF

      - name: Install dependencies
        working-directory: apps/admin
        run: npm install

      - name: Build
        working-directory: apps/admin
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.ADMIN_STATIC_WEB_APP_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/admin
          api_location: ''
          output_location: dist